[general]
framerate = 30
bars = 8
sleep_timer = 2
lower_cutoff_freq = 40
higher_cutoff_freq = 8000

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 0
frame_delimiter = 10

[smoothing]
noise_reduction = 77

# cava boosts the top bands, which made the 8 bars look mirrored (tall at both ends).
# Taper the highs so the bar reads bass (left) → treble (right).
[eq]
1 = 1
2 = 1
3 = 1
4 = 0.9
5 = 0.8
6 = 0.6
7 = 0.45
8 = 0.35
